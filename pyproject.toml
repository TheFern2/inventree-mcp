[project]
name = "inventree-mcp"
version = "1.0.0"
description = "MCP server for InvenTree inventory management — 13 tools, 130 operations"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26,<2",
    "inventree>=0.25.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27",
]

[project.scripts]
inventree-mcp = "server:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py", "client.py", "digikey.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
